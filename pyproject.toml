[project]
name = "legallens-india"
version = "0.1.0"
description = "Production-grade AI Legal Document Analyzer for Indian Startups"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api", "packages"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "T201",  # allow print in CLI/scripts
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["legallens"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "evaluation: AI evaluation tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*"]
ignore_missing_imports = true
