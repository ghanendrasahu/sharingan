name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -e "packages/document_processing[dev]"

      - name: Run Ruff check
        run: ruff check apps/api/ packages/document_processing/ --config pyproject.toml

      - name: Run Ruff format check
        run: ruff format --check apps/api/ packages/document_processing/ --config pyproject.toml

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e "packages/document_processing[dev]"
          pip install -e "apps/api[dev]" --no-deps
          pip install pytest pytest-cov pytest-asyncio aiosqlite email-validator pyyaml
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic asyncpg psycopg2-binary redis celery python-jose "passlib[bcrypt]" bcrypt python-multipart httpx structlog prometheus-client boto3 mangum razorpay

      - name: Run tests
        run: |
          python -m pytest apps/api/tests/unit/ packages/document_processing/tests/ \
            --cov=apps/api --cov=packages/document_processing \
            --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (SAST)
        run: |
          bandit -r apps/api/ -f json -o bandit-report.json -ll
        continue-on-error: true

      - name: Check Bandit high-severity findings
        run: |
          bandit -r apps/api/ -ll --severity-level high -f json | python -c "
          import sys, json
          data = json.load(sys.stdin)
          results = data.get('results', [])
          if results:
              print(f'::error::Bandit found {len(results)} high-severity issue(s)')
              for r in results:
                  print(f\"  {r['filename']}:{r['line_number']} - {r['issue_text']}\")
              sys.exit(1)
          print('No high-severity Bandit findings')
          "

      - name: Run Safety (dependencies)
        run: safety check --output json > safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  evaluation:
    name: AI Evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e "packages/document_processing[dev]"
          pip install -e "apps/api[dev]" --no-deps
          pip install aiosqlite email-validator pyyaml
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic asyncpg psycopg2-binary redis celery python-jose "passlib[bcrypt]" bcrypt python-multipart httpx structlog prometheus-client boto3 mangum razorpay

      - name: Run evaluation tests
        run: |
          python -m pytest apps/api/tests/unit/test_evaluation.py -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: legallens-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: legallens-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max