name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -e "packages/document_processing[dev]"

      - name: Run Ruff check
        run: ruff check apps/api/ packages/document_processing/ --config pyproject.toml

      - name: Run Ruff format check
        run: ruff format --check apps/api/ packages/document_processing/ --config pyproject.toml

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -e "packages/document_processing[dev]"
          pip install pytest pytest-cov pytest-asyncio aiosqlite email-validator

      - name: Run tests
        run: |
          python -m pytest apps/api/tests/unit/ packages/document_processing/tests/ \
            --cov=apps/api --cov=packages/document_processing \
            --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (SAST)
        run: bandit -r apps/api/ -f json -o bandit-report.json || true

      - name: Run Safety (dependencies)
        run: safety check --output json > safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json