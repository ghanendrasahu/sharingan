name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          DEBUG: "true"
        run: |
          pip install -e "packages/document_processing[dev]"
          pip install -e "apps/api[dev]" --no-deps
          pip install pytest pytest-cov pytest-asyncio aiosqlite email-validator pyyaml
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic asyncpg psycopg2-binary redis celery python-jose "passlib[bcrypt]" bcrypt python-multipart httpx structlog prometheus-client boto3 mangum razorpay

      - name: Run Ruff check
        run: |
          python -m ruff check apps/api/ packages/ --config pyproject.toml
          python -m ruff format apps/api/ packages/document_processing/ --config pyproject.toml --check

      - name: Run tests
        env:
          DEBUG: "true"
        run: |
          python -m pytest apps/api/tests/unit/ packages/document_processing/tests/ \
            --cov=apps/api --cov=packages/document_processing \
            --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (SAST)
        run: |
          bandit -r apps/api/ -f json -o bandit-report.json -ll -q
        continue-on-error: true

      - name: Check Bandit high-severity findings
        run: |
          python -c "
          import json
          try:
              with open('bandit-report.json') as f:
                  data = json.load(f)
              results = data.get('results', [])
              high = [r for r in results if r.get('issue_severity') == 'High']
              if high:
                  print(f'::error::Bandit found {len(high)} high-severity issue(s)')
                  for r in high:
                      print(f\"  {r['filename']}:{r['line_number']} - {r['issue_text']}\")
                  import sys; sys.exit(1)
              print('No high-severity Bandit findings')
          except Exception as e:
              print(f'Could not parse Bandit report: {e}')
          "

      - name: Run Safety (dependencies)
        run: |
          safety check --full-report > safety-report.json 2>&1 || true
          python -c "
          import json, sys
          try:
              with open('safety-report.json') as f:
                  data = json.load(f)
              vuln = data.get('vulnerabilities', [])
              critical_high = [v for v in vuln if v.get('severity') in ('Critical', 'High')]
              if critical_high:
                  print(f'::error::Safety found {len(critical_high)} critical/high vulnerability(ies)')
                  for v in critical_high:
                      print(f\"  {v.get('package', '?')}: {v.get('id', '?')}\")
                  import sys; sys.exit(1)
              print('No critical/high Safety vulnerabilities')
          except Exception as e:
              print(f'Could not parse Safety report: {e}')
          "

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          DEBUG: "true"
        run: |
          pip install pytest pytest-cov pytest-asyncio aiosqlite email-validator pyyaml

      - name: Run tests
        run: |
          python -m pytest apps/api/tests/unit/ packages/document_processing/tests/ \
            --cov=apps/api --cov=packages/document_processing \
            --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  evaluation:
    name: AI Evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          DEBUG: "true"
        run: |
          pip install -e "packages/document_processing[dev]"
          pip install -e "apps/api[dev]" --no-deps
          pip install aiosqlite email-validator pyyaml
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic asyncpg psycopg2-binary redis celery python-jose "passlib[bcrypt]" bcrypt python-multipart httpx structlog prometheus-client boto3 mangum razorpay

      - name: Run evaluation tests
        run: |
          python -m pytest apps/api/tests/unit/test_evaluation.py -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghanendrasahu/sharingan-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghanendrasahu/sharingan-web:latest