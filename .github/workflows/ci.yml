name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-only test values (never used in real environments).
env:
  DEBUG: "true"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: |
          python -m ruff check apps/api/ packages/ --config pyproject.toml

      - name: Run Ruff format check
        run: |
          python -m ruff format apps/api/ packages/document_processing/ --config pyproject.toml --check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync the workspace from the lockfile
        env:
          DEBUG: "true"
        run: uv sync --frozen --all-extras --all-packages

      - name: Run tests
        run: |
          uv run --no-sync python -m pytest apps/api/tests/ packages/document_processing/tests/ \
            --cov=apps/api --cov=packages \
            --cov-report=term-missing --cov-fail-under=60

  web:
    name: Web (lint & build)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit

      - name: Run Bandit (SAST)
        run: |
          bandit -r apps/api/ -f json -o bandit-report.json -ll -q || true

      - name: Fail on high-severity findings
        run: |
          python -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          high = [r for r in data.get('results', []) if r.get('issue_severity') == 'High']
          if high:
              print(f'::error::Bandit found {len(high)} high-severity issue(s)')
              for r in high:
                  print(f\"  {r['filename']}:{r['line_number']} - {r['issue_text']}\")
              sys.exit(1)
          print('No high-severity findings')
          "

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  evaluation:
    name: AI Evaluation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync the workspace from the lockfile
        run: uv sync --frozen --all-extras --all-packages

      - name: Run evaluation tests
        run: |
          uv run --no-sync python -m pytest tests/evaluation/ -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: legallens-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: false
          tags: legallens-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          tags: legallens-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build the single-container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: legallens-single:ci
          cache-from: type=gha,scope=single
          cache-to: type=gha,mode=max,scope=single

      - name: Verify the single-container image is not root
        run: |
          uid=$(docker run --rm --entrypoint id legallens-single:ci -u)
          if [ "$uid" = "0" ]; then
            echo "ERROR: the image runs as root"; exit 1
          fi
          echo "image runs as uid $uid"
