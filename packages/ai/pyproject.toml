[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legallens-ai"
version = "0.1.0"
description = "LegalLens AI - LangGraph analysis engine for legal documents"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["legallens_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
