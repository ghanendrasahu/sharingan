[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legallens-docproc"
version = "0.1.0"
description = "LegalLens Document Processing - PDF/DOCX extraction and clause segmentation"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]
docx = ["python-docx>=1.1.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0.0"]
all = ["pymupdf>=1.24.0", "python-docx>=1.1.0", "pytesseract>=0.3.10", "pillow>=10.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["legallens_docproc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
