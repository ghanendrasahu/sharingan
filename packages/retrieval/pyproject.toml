[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legallens-retrieval"
version = "0.1.0"
description = "LegalLens Retrieval - Hybrid BM25 + vector search"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["legallens_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
